# Template only. Replace example-domain certificates with your own valid TLS
# certificate and synchronize the exact origin with PANEL_PUBLIC_ORIGIN.
server {
    listen 3211 ssl;
    server_name panel.example.com;
    ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 1m;

    location / {
        # Never proxy public traffic directly to the unauthenticated bot :3210.
        proxy_pass http://127.0.0.1:3213;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }
}

server {
    listen 3212;
    server_name panel.example.com;
    # Canonical constant origin: never construct redirects from untrusted Host.
    return 301 https://panel.example.com:3211$request_uri;
}
